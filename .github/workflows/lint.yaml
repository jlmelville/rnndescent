on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: lint

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Pinned to a full-length commit SHA for immutability; Dependabot updates this reference.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Air
        uses: posit-dev/setup-air@482cb5912394878ab5a63b75db0f9d19cc6df5ba # v1.0.3
        with:
          version: "0.12.0"

      - name: Check R formatting
        shell: bash
        run: |
          air_version="$(air --version)"
          printf '%s\n' "${air_version}"
          test "${air_version}" = "air 0.12.0"
          air format . --check

      # Pinned to a full-length commit SHA for immutability; Dependabot updates this reference.
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          use-public-rspm: true

      - name: Check R Markdown formatting
        shell: bash
        run: |
          air --version
          # Shared pkgdown formatter pinned to its reviewed skill revision.
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/jlmelville/codex-workflows/fed18a49d881a09851e9852aec1ef79a317d282b/skills/r-docs-pkgdown/scripts/format-rmd.py \
            --output "${RUNNER_TEMP}/format-rmd.py"
          printf '%s  %s\n' \
            '3fee3412a5d81d7d391bdce9228148e856f3532ee6b227e07396d8501ffe4fe1' \
            "${RUNNER_TEMP}/format-rmd.py" | shasum -a 256 --check --quiet
          mapfile -d '' -t rmd_files < <(git ls-files -z -- '*.[Rr][Mm][Dd]')
          python3 "${RUNNER_TEMP}/format-rmd.py" --check "${rmd_files[@]}"

      # Pinned to a full-length commit SHA for immutability; Dependabot updates this reference.
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          extra-packages: any::lintr, local::.
          needs: lint

      - name: Lint
        run: |
          Rscript -e 'lints <- lintr::lint_package(); print(lints); quit(status = if (length(lints) > 0) 1L else 0L)'
