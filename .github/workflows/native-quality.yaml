on:
  push:
    branches: [main, master]
    paths:
      - .clang-format
      - .github/workflows/native-quality.yaml
      - DESCRIPTION
      - NEWS.md
      - README.md
      - inst/include/**
      - src/**
      - tools/native-quality.sh
      - tools/requirements-clang-format.txt
      - tools/test-pforr-exception-transport.cpp
      - tools/test-pforr-exception-transport.sh
      - tools/tsan-pforr.sh
      - tools/tsan-build-candidates.cpp
      - tools/tsan-build-candidates.sh
  pull_request:
    branches: [main, master]
    paths:
      - .clang-format
      - .github/workflows/native-quality.yaml
      - DESCRIPTION
      - NEWS.md
      - README.md
      - inst/include/**
      - src/**
      - tools/native-quality.sh
      - tools/requirements-clang-format.txt
      - tools/test-pforr-exception-transport.cpp
      - tools/test-pforr-exception-transport.sh
      - tools/tsan-pforr.sh
      - tools/tsan-build-candidates.cpp
      - tools/tsan-build-candidates.sh
  workflow_dispatch:

name: Native quality

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-quality:
    name: Native quality
    runs-on: ubuntu-24.04
    steps:
      # Pinned to a full-length commit SHA for immutability; Dependabot updates this reference.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Pinned to a full-length commit SHA for immutability; Dependabot updates this reference.
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          use-public-rspm: true

      # Pinned to a full-length commit SHA for immutability; Dependabot updates this reference.
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          packages: deps::.
          dependencies: '"hard"'

      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            libc++-dev \
            libc++abi-dev \
            python3-venv \
            shellcheck

      - name: Install clang-format 21.1.8
        run: |
          formatter_venv="$RUNNER_TEMP/clang-format-venv"
          python3 -m venv "$formatter_venv"
          "$formatter_venv/bin/python" -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --no-deps \
            --requirement tools/requirements-clang-format.txt
          printf '%s\n' "$formatter_venv/bin" >> "$GITHUB_PATH"

      - name: Check native scripts
        run: |
          bash -n \
            tools/native-quality.sh \
            tools/test-pforr-exception-transport.sh \
            tools/tsan-build-candidates.sh \
            tools/tsan-pforr.sh
          shellcheck \
            tools/native-quality.sh \
            tools/test-pforr-exception-transport.sh \
            tools/tsan-build-candidates.sh \
            tools/tsan-pforr.sh

      - name: Check native quality
        run: tools/native-quality.sh

  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    steps:
      # Pinned to a full-length commit SHA for immutability; Dependabot updates this reference.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check parallel exception transport
        run: tools/tsan-pforr.sh

      - name: Check parallel candidate construction
        run: tools/tsan-build-candidates.sh
